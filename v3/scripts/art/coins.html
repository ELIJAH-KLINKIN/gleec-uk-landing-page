<!doctype html>
<!-- coins.html — the "One IBAN, 24 currencies" card art: £, € and $ coins in
     metal, lit by the shared studio (studio.js). Rendered offline by render.mjs;
     the site only ships the resulting images. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: transparent; }
    </style>
    <script type="importmap">
      { "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }
    </script>
  </head>
  <body>
    <script type="module">
      import { THREE, scene, mats, contactShadow, camera, finish } from "/studio.js";
      import { SVGLoader } from "three/addons/loaders/SVGLoader.js";

      const GLYPHS = await (await fetch("/glyphs.json")).json();

      // ---------- Coin: lathe profile with a raised rim and rounded edge ----------
      function coinGeometry(R = 1, T = 0.26) {
        const h = T / 2;
        const face = h - 0.035; // face level at the rim
        const dome = 0.035; // faces bulge slightly, so light rolls across them
        const rimIn = R * 0.83;
        const r = 0.08;
        const p = [];
        const faceCurve = (sign) => {
          const pts = [];
          for (let i = 0; i <= 16; i++) {
            const x = (rimIn * i) / 16;
            pts.push(new THREE.Vector2(Math.max(x, 0.0001), sign * (face + dome * (1 - (x / rimIn) ** 2))));
          }
          return pts;
        };
        p.push(...faceCurve(-1), new THREE.Vector2(rimIn + 0.035, -h));
        for (let i = 0; i <= 12; i++) {
          const a = -Math.PI / 2 + (Math.PI / 2) * (i / 12);
          p.push(new THREE.Vector2(R - r + r * Math.cos(a), -h + r + r * Math.sin(a)));
        }
        for (let i = 0; i <= 12; i++) {
          const a = (Math.PI / 2) * (i / 12);
          p.push(new THREE.Vector2(R - r + r * Math.cos(a), h - r + r * Math.sin(a)));
        }
        p.push(new THREE.Vector2(rimIn + 0.035, h), ...faceCurve(1).reverse());
        const g = new THREE.LatheGeometry(p, 160);
        g.rotateX(Math.PI / 2); // faces look along ±Z
        return { geometry: g, face: face + dome };
      }

      // ---------- Glyph: Inter Bold outline, extruded with a soft bevel ----------
      const svg = new SVGLoader();
      function glyphGeometry(ch, height, depth) {
        const g = GLYPHS.glyphs[ch];
        const data = svg.parse(`<svg xmlns="http://www.w3.org/2000/svg"><path d="${g.d}"/></svg>`);
        const shapes = data.paths.flatMap((path) => SVGLoader.createShapes(path));
        const s = height / 1512; // £ cap height sets the scale for all three
        const geo = new THREE.ExtrudeGeometry(shapes, {
          depth: depth / s,
          bevelEnabled: true,
          bevelThickness: 0.018 / s,
          bevelSize: 0.014 / s,
          bevelSegments: 5,
          curveSegments: 24,
        });
        const [x0, y0, x1, y1] = g.bounds;
        geo.translate(-(x0 + x1) / 2, -(y0 + y1) / 2, 0);
        geo.scale(s, s, s);
        return geo;
      }


      function coin(ch, body, glyph) {
        const group = new THREE.Group();
        const { geometry, face } = coinGeometry();
        const disc = new THREE.Mesh(geometry, body);
        group.add(disc);
        const g = new THREE.Mesh(glyphGeometry(ch, 0.92, 0.05), glyph);
        g.position.z = face - 0.03;
        group.add(g);
        return group;
      }

            // A rising diagonal, front to back: £ (brand purple), then € and $ (silver).
      const layout = [
        { ch: "$", body: mats.aluminium, glyph: mats.violet, pos: [1.55, 0.95, -1.4], rot: [-0.62, -0.28, -0.08], s: 0.9 },
        { ch: "€", body: mats.aluminium, glyph: mats.violet, pos: [0.3, 0.3, -0.45], rot: [-0.66, -0.2, -0.05], s: 0.95 },
        { ch: "£", body: mats.purple, glyph: mats.white, pos: [-1.05, -0.4, 0.55], rot: [-0.7, -0.12, 0], s: 1.05 },
      ];
      for (const c of layout) {
        const m = coin(c.ch, c.body, c.glyph);
        m.position.set(...c.pos);
        m.rotation.set(...c.rot);
        m.scale.setScalar(c.s);
        scene.add(m);
      }

      for (const c of layout) contactShadow(c.pos[0], c.pos[2] + 0.1, 2.3 * c.s, 0.9 * c.s);

      finish(camera());
    </script>
  </body>
</html>
