<!doctype html>
<!-- coins.html — the "One IBAN, 24 currencies" card art: £, € and $ coins in
     metal, lit by a studio with a Gleec-purple kicker. Rendered offline by
     render.mjs; the site only ships the resulting images. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: transparent; }
    </style>
    <script type="importmap">
      { "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from "three";
      import { SVGLoader } from "three/addons/loaders/SVGLoader.js";

      const params = new URLSearchParams(location.search);
      const W = Number(params.get("w") || 1008);
      const H = Number(params.get("h") || 720);
      const GLYPHS = await (await fetch("/glyphs.json")).json();

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.NeutralToneMapping; // keeps the brand purple purple
      renderer.setClearColor(0x000000, 0);
      document.body.appendChild(renderer.domElement);

      // ---------- Studio: a dark room with softboxes, used only for reflections ----------
      function studio() {
        const env = new THREE.Scene();
        env.add(new THREE.Mesh(new THREE.BoxGeometry(24, 14, 24), new THREE.MeshBasicMaterial({ color: 0x34343c, side: THREE.BackSide })));
        const panel = (w, h, color, k, pos) => {
          const m = new THREE.Mesh(
            new THREE.PlaneGeometry(w, h),
            new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(k), side: THREE.DoubleSide }),
          );
          m.position.set(...pos);
          m.lookAt(0, 0, 0);
          env.add(m);
        };
        panel(16, 10, 0xffffff, 2.6, [0, 9, 3]); // big overhead softbox (what tilted faces see)
        panel(6, 6, 0xffffff, 3, [-6, 5, 6]); // key, front left
        panel(1.4, 9, 0xe6ebff, 3, [8, 1, 3]); // strip, right
        panel(12, 3.5, 0x8c41ff, 3.2, [0, -5, -7]); // brand kicker, low behind
        panel(8, 4, 0xffffff, 0.6, [0, 1, 10]); // front fill, soft
        return env;
      }
      const scene = new THREE.Scene();
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(studio(), 0.02).texture;

      // ---------- Coin: lathe profile with a raised rim and rounded edge ----------
      function coinGeometry(R = 1, T = 0.26) {
        const h = T / 2;
        const face = h - 0.035; // face level at the rim
        const dome = 0.035; // faces bulge slightly, so light rolls across them
        const rimIn = R * 0.83;
        const r = 0.08;
        const p = [];
        const faceCurve = (sign) => {
          const pts = [];
          for (let i = 0; i <= 16; i++) {
            const x = (rimIn * i) / 16;
            pts.push(new THREE.Vector2(Math.max(x, 0.0001), sign * (face + dome * (1 - (x / rimIn) ** 2))));
          }
          return pts;
        };
        p.push(...faceCurve(-1), new THREE.Vector2(rimIn + 0.035, -h));
        for (let i = 0; i <= 12; i++) {
          const a = -Math.PI / 2 + (Math.PI / 2) * (i / 12);
          p.push(new THREE.Vector2(R - r + r * Math.cos(a), -h + r + r * Math.sin(a)));
        }
        for (let i = 0; i <= 12; i++) {
          const a = (Math.PI / 2) * (i / 12);
          p.push(new THREE.Vector2(R - r + r * Math.cos(a), h - r + r * Math.sin(a)));
        }
        p.push(new THREE.Vector2(rimIn + 0.035, h), ...faceCurve(1).reverse());
        const g = new THREE.LatheGeometry(p, 160);
        g.rotateX(Math.PI / 2); // faces look along ±Z
        return { geometry: g, face: face + dome };
      }

      // ---------- Glyph: Inter Bold outline, extruded with a soft bevel ----------
      const svg = new SVGLoader();
      function glyphGeometry(ch, height, depth) {
        const g = GLYPHS.glyphs[ch];
        const data = svg.parse(`<svg xmlns="http://www.w3.org/2000/svg"><path d="${g.d}"/></svg>`);
        const shapes = data.paths.flatMap((path) => SVGLoader.createShapes(path));
        const s = height / 1512; // £ cap height sets the scale for all three
        const geo = new THREE.ExtrudeGeometry(shapes, {
          depth: depth / s,
          bevelEnabled: true,
          bevelThickness: 0.018 / s,
          bevelSize: 0.014 / s,
          bevelSegments: 5,
          curveSegments: 24,
        });
        const [x0, y0, x1, y1] = g.bounds;
        geo.translate(-(x0 + x1) / 2, -(y0 + y1) / 2, 0);
        geo.scale(s, s, s);
        return geo;
      }

      const mats = {
        purple: new THREE.MeshPhysicalMaterial({ color: 0x8c41ff, metalness: 0.35, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.2 }),
        aluminium: new THREE.MeshPhysicalMaterial({ color: 0xf2f3f7, metalness: 0.7, roughness: 0.25, clearcoat: 0.6, clearcoatRoughness: 0.1 }),
        white: new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0, roughness: 0.35, clearcoat: 1, clearcoatRoughness: 0.1 }),
        violet: new THREE.MeshPhysicalMaterial({ color: 0x8c41ff, metalness: 0.5, roughness: 0.25, clearcoat: 1 }),
      };

      function coin(ch, body, glyph) {
        const group = new THREE.Group();
        const { geometry, face } = coinGeometry();
        const disc = new THREE.Mesh(geometry, body);
        group.add(disc);
        const g = new THREE.Mesh(glyphGeometry(ch, 0.92, 0.05), glyph);
        g.position.z = face - 0.03;
        group.add(g);
        return group;
      }

            // A rising diagonal, front to back: £ (brand purple), then € and $ (silver).
      const layout = [
        { ch: "$", body: mats.aluminium, glyph: mats.violet, pos: [1.55, 0.95, -1.4], rot: [-0.62, -0.28, -0.08], s: 0.9 },
        { ch: "€", body: mats.aluminium, glyph: mats.violet, pos: [0.3, 0.3, -0.45], rot: [-0.66, -0.2, -0.05], s: 0.95 },
        { ch: "£", body: mats.purple, glyph: mats.white, pos: [-1.05, -0.4, 0.55], rot: [-0.7, -0.12, 0], s: 1.05 },
      ];
      for (const c of layout) {
        const m = coin(c.ch, c.body, c.glyph);
        m.position.set(...c.pos);
        m.rotation.set(...c.rot);
        m.scale.setScalar(c.s);
        scene.add(m);
      }

      // Soft contact shadows: a blurred ellipse under each coin (no shadow maps, no banding).
      const blob = (() => {
        const c = document.createElement("canvas");
        c.width = c.height = 256;
        const x = c.getContext("2d");
        const g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
        g.addColorStop(0, "rgba(0,0,0,1)");
        g.addColorStop(0.45, "rgba(0,0,0,0.45)");
        g.addColorStop(1, "rgba(0,0,0,0)");
        x.fillStyle = g;
        x.fillRect(0, 0, 256, 256);
        return new THREE.CanvasTexture(c);
      })();
      const shadowMat = new THREE.MeshBasicMaterial({ map: blob, transparent: true, depthWrite: false, opacity: 0.2, toneMapped: false });
      for (const c of layout) {
        const m = new THREE.Mesh(new THREE.PlaneGeometry(2.3 * c.s, 0.9 * c.s), shadowMat);
        m.rotation.x = -Math.PI / 2;
        m.position.set(c.pos[0], -1.45, c.pos[2] + 0.1);
        scene.add(m);
      }

      scene.add(new THREE.HemisphereLight(0xffffff, 0x8c41ff, 0.9));
      const key = new THREE.DirectionalLight(0xffffff, 1.6);
      key.position.set(-3, 6, 5);
      scene.add(key);

      const camera = new THREE.PerspectiveCamera(26, W / H, 0.1, 100);
      camera.position.set(0.25, 2.9, 9.3);
      camera.lookAt(0.25, 0.1, 0);

      window.renderArt = ({ shadow = 0.2, exposure = 1 } = {}) => {
        shadowMat.opacity = shadow;
        renderer.toneMappingExposure = exposure;
        renderer.render(scene, camera);
        return renderer.domElement.toDataURL("image/png");
      };
      window.ready = true;
    </script>
  </body>
</html>
